<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<title>{{ title }}</title>
		<meta
			name="description"
			content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}"
		/>
		<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap"
		/>
		<link rel="stylesheet" href="/assets/css/redesign.css" />
	</head>
	<body>
		<a class="skip" href="#main">Skip to main content</a>
		<header class="site-header">
			<div class="container site-header__inner">
				<a class="site-header__logo" href="/redesign/">
					<img src="/img/Logos/In Queue White.svg" alt="In Queue home" width="120" height="32" />
				</a>
				<nav aria-label="Main">
					<ul class="site-nav">
						<li><a href="/redesign/#services">Services</a></li>
						<li><a href="/redesign/#events">Events</a></li>
						<li><a href="/redesign/#team">Team</a></li>
						<li><a href="/news/">News</a></li>
						<li>
							<a class="btn btn--primary btn--small" href="/redesign/#contact">Partner with us</a>
						</li>
					</ul>
				</nav>
			</div>
		</header>

		<main id="main">{{ content }}</main>

		<footer class="site-footer">
			<div class="container site-footer__inner">
				<div>
					<p>© {{ "now" | date: "%Y" }} In Queue. Worker-owned and independent.</p>
					<p><a href="/code-of-conduct/">Code of Conduct</a></p>
				</div>
				<ul class="site-footer__links">
					<li><a href="mailto:connect@playinqueue.com">connect@playinqueue.com</a></li>
					<li><a href="https://discord.gg/NjYxkMJGMj">Discord</a></li>
					<li><a href="https://www.twitch.tv/playinqueue">Twitch</a></li>
					<li><a href="https://bsky.app/profile/playinqueue.com">Bluesky</a></li>
					<li><a href="https://x.com/playinqueue">X</a></li>
					<li><a href="https://www.instagram.com/playinqueue/">Instagram</a></li>
					<li><a href="https://www.tiktok.com/@playinqueue">TikTok</a></li>
				</ul>
			</div>
		</footer>
	</body>
</html>
